    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {

      --white: #ffffff;
      --black: #0a0a0a;
    }
    html, body {
      height: 100%;
      font-family: 'Montserrat', sans-serif;
      color: var(--white);
      background: var(--black);
      overflow: hidden;
    }
    .bg-fixed {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('bg1.jpg') no-repeat center center / cover;
      filter: brightness(0.28);
    }
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 48px;
      background: rgba(10,10,10,0.70);

    }
    .nav-logo { height: 40px; }
    .nav-links { display: flex; gap: 36px; list-style: none; }
    .nav-links a {
      color: rgba(255,255,255,0.78);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      transition: color 0.25s;
    }
    .nav-links a:hover { color: var(--white); }

    .center {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      animation: fadeIn 0.8s ease both;
    }
    .check-icon {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(232,28,46,0.15);
      border: 2px solid var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 900;
      margin-bottom: 14px;
    }
    p {
      font-size: 16px;
      color: rgba(255,255,255,0.62);
      max-width: 440px;
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 50px;
      background: var(--red);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      transition: background 0.25s, transform 0.2s, box-shadow 0.2s;
    }
    .btn-home:hover {
      background: #b51020;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(232,28,46,0.40);
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

    @media (max-width: 768px) {
      nav { padding: 16px 24px; }
      .nav-links { display: none; }
    }
  
    .nav-right { display:flex; align-items:center; gap:16px; }
    .nav-social { display:flex; gap:14px; align-items:center; }
    .nav-social a { color:rgba(255,255,255,0.65); text-decoration:none; transition:color 0.2s,transform 0.2s; line-height:1; display:flex; align-items:center; }
    .nav-social a:hover { color:var(--white); transform:scale(1.15); }
    .nav-cta { background:var(--red); color:white !important; padding:8px 18px; border-radius:50px; text-decoration:none; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; transition:background 0.25s; white-space:nowrap; }
    .nav-cta:hover { background:var(--red-dark) !important; }
    .mobile-social { display:flex; gap:24px; margin-top:8px; }
    .mobile-social a { color:rgba(255,255,255,0.7); text-decoration:none; display:flex; align-items:center; transition:color 0.2s; }
    .mobile-social a:hover { color:var(--white); }
    
    .site-footer {
      position: relative; z-index: 10;
      text-align: center; padding: 40px 24px 56px;
      border-top: 1px solid rgba(255,255,255,0.07);

    .footer-social a { color:rgba(255,255,255,0.55); text-decoration:none; display:flex; align-items:center; transition:color 0.2s, transform 0.2s; }
    .footer-social a:hover { color:var(--white); transform:translateY(-3px); }
    .site-footer p { font-size:11px; color:rgba(255,255,255,0.28); letter-spacing:0.5px; }
